name: Update Publications
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync all publication tabs
        env:
          PUBLICATIONS_APPS_SCRIPT_URL: ${{ secrets.PUBLICATIONS_APPS_SCRIPT_URL }}
        run: python scripts/sync_publications.py
      - name: Commit JSON only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/publications.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update publications from Google Sheets tabs'
            git push
          fi
